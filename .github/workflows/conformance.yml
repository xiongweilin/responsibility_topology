name: Python-Lean Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
      - name: Install Python test dependency
        run: python -m pip install pytest
      - name: Run Python reference kernel and cross-language conformance
        run: >-
          python -m pytest -q
          test_v0122_kernel.py
          test_v0122_currentness.py
          test_v0122_conformance.py
          test_v0122_currentness_conformance.py
      - name: Fetch pinned portable-runtime raw withdrawal artifact
        run: >-
          curl -fsSL
          https://raw.githubusercontent.com/xiongweilin/portable-runtime/21fa75e0364b9a67d3596295e005e8052504e694/tests/fixtures/o0/raw_withdrawal_transition_v1.json
          -o /tmp/raw_withdrawal_transition_v1.json
      - name: Lean-check raw runtime transition artifact
        working-directory: formal
        run: >-
          lake env lean --run ResponsibilityTopology/Bridge/RawWithdrawalCli.lean
          /tmp/raw_withdrawal_transition_v1.json
