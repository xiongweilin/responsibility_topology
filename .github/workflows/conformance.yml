name: Python-Lean Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
      - name: Install Python test dependency
        run: python -m pip install pytest
      - name: Run Python reference kernel and cross-language conformance
        run: >-
          python -m pytest -q
          test_v0122_kernel.py
          test_v0122_currentness.py
          test_v0122_conformance.py
          test_v0122_currentness_conformance.py
      - name: Verify frozen Strict-L6 runtime artifact
        run: >-
          echo "61705ce6d1f2005571ba174232df3aae6d3a64b3b872029dd2156c664732b465  frozen/strict-l6/raw_withdrawal_transition_v1.json"
          | sha256sum -c -
      - name: Lean-check frozen raw runtime transition artifact
        working-directory: formal
        run: >-
          lake env lean --run ResponsibilityTopology/Bridge/RawWithdrawalCli.lean
          ../frozen/strict-l6/raw_withdrawal_transition_v1.json
