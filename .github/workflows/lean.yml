name: Lean

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, formal/bc-foundation]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
