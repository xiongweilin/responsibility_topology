name: Lean

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, formal/bc-foundation]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          test: false
      - name: Reject proof placeholders
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formal/ResponsibilityTopology formal/ResponsibilityTopology.lean; then
            echo 'Proof placeholder found in formal core.'
            exit 1
          fi
      - name: Print BC axiom dependencies
        working-directory: formal
        run: lake env lean ResponsibilityTopology/Audit.lean
